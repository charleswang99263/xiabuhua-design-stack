<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d"><title id="t">调研一页纸 / Survey One-Pager｜单位：版式示意</title><desc id="d">对应阅读任务的独立主侧栏、时间线、KPI或定尺卡片编排；数据为构造示例。</desc><rect width="640" height="380" fill="#fcfbf5"/><text x="24" y="28" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#20251f" text-anchor="start" font-weight="700">调研一页纸 / Survey One-Pager</text><text x="616" y="27" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="end" font-weight="400">单位：版式示意</text><text x="24" y="64" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#20251f" text-anchor="start" font-weight="700">一次任务，在哪里受阻？</text><text x="24" y="90" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="start" font-weight="400">先给结论，再把证据与解释放在同一视野。</text><line x1="458" y1="56" x2="458" y2="345" stroke="#d8ddd5" stroke-width="1"/><text x="479" y="78" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#20251f" text-anchor="start" font-weight="700">样本与边界</text><text x="479" y="110" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">100 个构造样本</text><text x="479" y="136" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">单选分类，合计100%</text><text x="479" y="162" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">不支持因果推断</text><text x="479" y="188" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">细读 → 对照 → 行动</text><text x="24" y="132" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="36" fill="#2f6e96" text-anchor="start" font-weight="700">41%</text><text x="126" y="127" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#20251f" text-anchor="start" font-weight="700">信息入口是主要卡点</text><text x="126" y="148" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">演示：41 / 100，与下面图表一致</text><text x="24" y="199" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#20251f" text-anchor="start" font-weight="400">入口</text><rect x="75.00" y="188.00" width="246.00" height="14.00" fill="#2f6e96" stroke="none" stroke-width="1" rx="0"/><text x="331" y="199" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#20251f" text-anchor="start" font-weight="400">41%</text><text x="24" y="233" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#20251f" text-anchor="start" font-weight="400">理解</text><rect x="75.00" y="222.00" width="174.00" height="14.00" fill="#397a5c" stroke="none" stroke-width="1" rx="0"/><text x="259" y="233" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#20251f" text-anchor="start" font-weight="400">29%</text><text x="24" y="267" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#20251f" text-anchor="start" font-weight="400">操作</text><rect x="75.00" y="256.00" width="108.00" height="14.00" fill="#c49b37" stroke="none" stroke-width="1" rx="0"/><text x="193" y="267" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#20251f" text-anchor="start" font-weight="400">18%</text><text x="24" y="301" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#20251f" text-anchor="start" font-weight="400">其他</text><rect x="75.00" y="290.00" width="72.00" height="14.00" fill="#b4523e" stroke="none" stroke-width="1" rx="0"/><text x="157" y="301" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#20251f" text-anchor="start" font-weight="400">12%</text><text x="24" y="337" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#20251f" text-anchor="start" font-weight="400">下一步：对照具体卡点，验证入口说明。</text><text x="24" y="365" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">构造示例 · 非真实调研/经营结果 · 来源、期间与口径随证据填写</text></svg>