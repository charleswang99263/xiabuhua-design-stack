<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d"><title id="t">Big Slice：占比角度 × 强度半径｜单位：占比% / 分钟</title><desc id="d">每个扇区的角度对应占比，独立半径对应每日分钟数。</desc><rect width="640" height="380" fill="#fcfbf5"/><text x="24" y="28" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#20251f" text-anchor="start" font-weight="700">Big Slice：占比角度 × 强度半径</text><text x="616" y="27" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="end" font-weight="400">单位：占比% / 分钟</text><text x="24" y="60" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="start" font-weight="400">角度 = 占比；半径 = 每日时长（0–60 分钟）</text><path data-share="31" data-minutes="15" data-radius="30.0" d="M 190 205 L190.00 175.00 A30.00 30.00 0 0 1 217.89 216.04 Z" fill="#2f6e96" stroke="#2f6e96" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="120" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#20251f" text-anchor="start" font-weight="400">效率 · 31% · 15 分钟</text><path data-share="27" data-minutes="30" data-radius="60.0" d="M 190 205 L245.79 227.09 A60.00 60.00 0 0 1 161.09 257.58 Z" fill="#397a5c" stroke="#397a5c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="156" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#20251f" text-anchor="start" font-weight="400">稳定 · 27% · 30 分钟</text><path data-share="24" data-minutes="45" data-radius="90.0" d="M 190 205 L146.64 283.87 A90.00 90.00 0 0 1 108.57 166.68 Z" fill="#c49b37" stroke="#c49b37" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="192" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#20251f" text-anchor="start" font-weight="400">协作 · 24% · 45 分钟</text><path data-share="18" data-minutes="60" data-radius="120.0" d="M 190 205 L81.42 153.91 A120.00 120.00 0 0 1 190.00 85.00 Z" fill="#b4523e" stroke="#b4523e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="228" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#20251f" text-anchor="start" font-weight="400">探索 · 18% · 60 分钟</text><circle cx="190.00" cy="205.00" r="30.00" fill="none" stroke="#d8ddd5" stroke-width="0.7"/><text x="224.0" y="201" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">15</text><circle cx="190.00" cy="205.00" r="60.00" fill="none" stroke="#d8ddd5" stroke-width="0.7"/><text x="254.0" y="201" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">30</text><circle cx="190.00" cy="205.00" r="90.00" fill="none" stroke="#d8ddd5" stroke-width="0.7"/><text x="284.0" y="201" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">45</text><circle cx="190.00" cy="205.00" r="120.00" fill="none" stroke="#d8ddd5" stroke-width="0.7"/><text x="314.0" y="201" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">60</text><text x="24" y="353" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#6c756d" text-anchor="start" font-weight="400">参照环 = 15 / 30 / 45 / 60 分钟；面积不是第三个数值</text></svg>