<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d"><title id="t">研究简报卡 / Research Brief Card｜单位：版式示意</title><desc id="d">对应阅读任务的独立主侧栏、时间线、KPI或定尺卡片编排；数据为构造示例。</desc><rect width="640" height="380" fill="#fcfbf5"/><text x="24" y="28" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#20251f" text-anchor="start" font-weight="700">研究简报卡 / Research Brief Card</text><text x="616" y="27" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="end" font-weight="400">单位：版式示意</text><rect x="24.00" y="52.00" width="248.00" height="295.00" fill="#f2f0e5" stroke="#20251f" stroke-width="1" rx="0"/><text x="40" y="75" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">RESEARCH / DEMO</text><text x="40" y="103" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#20251f" text-anchor="start" font-weight="700">信息很多，</text><text x="40" y="128" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#20251f" text-anchor="start" font-weight="700">先抓住关键判断。</text><text x="40" y="175" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="34" fill="#20251f" text-anchor="start" font-weight="700">41%</text><text x="126" y="169" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6c756d" text-anchor="start" font-weight="400">入口阻力</text><text x="126" y="189" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="9" fill="#6c756d" text-anchor="start" font-weight="400">构造样本41/100</text><rect x="40.00" y="208.00" width="180.40" height="8.00" fill="#20251f" stroke="none" stroke-width="1" rx="0"/><rect x="40.00" y="227.00" width="127.60" height="8.00" fill="#2f6e96" stroke="none" stroke-width="1" rx="0"/><rect x="40.00" y="246.00" width="79.20" height="8.00" fill="#397a5c" stroke="none" stroke-width