function setupCanvas(kind,r,d,c){
 const canvas=$('canvas',r),host=$('.canvas-frame',r),info=$('[data-canvas-info]',r),btn=$('[data-canvas-add]',r),x=CANVAS_COPY[kind];
 const nodeText=()=>SPACE_NODES[d.selected].label+' ↔ '+SPACE_EDGES.filter(e=>e.includes(d.selected)).map(e=>SPACE_NODES[e.find(i=>i!==d.selected)].label).join('、');
 const result=()=>{const message=kind==='token'?nodeText():kind==='particle'?`固定 25 个粒子，输入信号 ${d.signals} 个。`:`当前 ${d.balls.length} / 8 个事项。`;info.textContent=message+' '+x.boundary;report(message+' '+x.boundary);const count=$('[data-canvas-scale]',r);if(count)count.textContent=kind==='token'?'PERSPECTIVE / '+SPACE_NODES[d.selected].label:kind==='particle'?'SIGNALS / '+String(d.signals).padStart(2,'0'):'ITEMS / '+d.balls.length+' OF 8';btn.disabled=kind==='physics'&&d.balls.length>=8;if(btn.disabled)btn.textContent='容量已满 8 / 8'};
 if(!canvas){result();return}let ctx;try{ctx=canvas.getContext('2d')}catch(_){ctx=null}if(!ctx){host.innerHTML=canvasFallback(kind,d);btn.disabled=true;result();report('Canvas 不可用，已自动显示可读静态快照。'+info.textContent);return}
 let width=1,height=1,dpr=1,points=[],drag=null,moved=false,disposed=false;let signalRipple=null;
 const colors=()=>{const css=getComputedStyle(document.body);return Object.fromEntries(['ink','accent','accent2','line','surface','tint','muted'].map(k=>[k,css.getPropertyValue('--'+k).trim()]))};
 function paint(){if(disposed||!canvas.isConnected)return;const col=colors();ctx.clearRect(0,0,width,height);ctx.font='12px "Helvetica Neue", "PingFang SC", sans-serif';ctx.textAlign='left';ctx.lineWidth=1;
  // A visible coordinate field belongs to the experiment, never a statistical axis.
  ctx.strokeStyle=col.line;ctx.globalAlpha=.23;for(let gx=22;gx<width;gx+=35){for(let gy=45;gy<height-25;gy+=35){ctx.beginPath();ctx.moveTo(gx-2,gy);ctx.lineTo(gx+2,gy);ctx.moveTo(gx,gy-2);ctx.lineTo(gx,gy+2);ctx.stroke()}}ctx.globalAlpha=1;
  if(kind==='token'){
   const radius=Math.min(width*.27,height*.34);ctx.strokeStyle=col.line;ctx.globalAlpha=.65;ctx.beginPath();ctx.ellipse(width/2,height*.51,radius*1.5,radius*.55,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(width/2,height*.51,radius*.7,radius,Math.sin(d.rotation.y)*.7,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
   points=SPACE_NODES.map((n,i)=>({...LOGIC.project(n,d.rotation,width,height),i}));
   for(const [a,b] of SPACE_EDGES){const p=points[a],q=points[b],selected=a===d.selected||b===d.selected;ctx.strokeStyle=selected?col.accent:col.line;ctx.lineWidth=selected?2.5:1.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;ctx.fillStyle=selected?col.accent:col.line;ctx.beginPath();ctx.arc(mx,my,3,0,Math.PI*2);ctx.fill()}
   for(const p of [...points].sort((a,b)=>b.z-a.z)){const is=p.i===d.selected,rad=(is?17:12)*(1-p.z*.08);ctx.fillStyle=col.surface;ctx.beginPath();ctx.arc(p.x,p.y,rad+6,0,Math.PI*2);ctx.fill();ctx.fillStyle=is?col.accent:col.accent2;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fill();if(is){ctx.strokeStyle=col.accent;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(p.x,p.y,rad+8,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}ctx.fillStyle=col.ink;ctx.font=(is?'600 ':'')+'13px "PingFang SC", sans-serif';ctx.fillText(SPACE_NODES[p.i].label,p.x+rad+11,p.y+4);ctx.fillStyle=col.muted;ctx.font='9px monospace';ctx.fillText('0'+(p.i+1),p.x+rad+11,p.y+17)}
  }else if(kind==='particle'){
   for(let i=0;i<d.particles.length;i++)for(let j=i+1;j<d.particles.length;j++){const a=d.particles[i],b=d.particles[j],distance=Math.hypot((a.x-b.x)*width,(a.y-b.y)*height);if(distance<Math.min(width*.22,150)){ctx.strokeStyle=col.accent2;ctx.globalAlpha=(1-distance/Math.min(width*.22,150))*.3;ctx.beginPath();ctx.moveTo(a.x*width,a.y*height);ctx.lineTo(b.x*width,b.y*height);ctx.stroke()}}ctx.globalAlpha=1;
   d.particles.forEach((p,i)=>{const px=p.x*width,py=p.y*height;ctx.fillStyle=i===d.signals%25&&d.signals?col.accent2:col.accent;ctx.globalAlpha=.09;ctx.beginPath();ctx.arc(px,py,12+(i%3)*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(px,py,3+(i%3),0,Math.PI*2);ctx.fill()});if(signalRipple){ctx.strokeStyle=col.accent;ctx.globalAlpha=Math.max(0,1-signalRipple.age/1100);ctx.lineWidth=2;ctx.beginPath();ctx.arc(signalRipple.x*width,signalRipple.y*height,15+signalRipple.age*.08,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  }else{
   const radius=Math.min(24,width*.065),floor=height*.83;ctx.strokeStyle=col.ink;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(18,floor+radius);ctx.lineTo(width-18,floor+radius);ctx.stroke();ctx.fillStyle=col.muted;ctx.font='9px monospace';ctx.fillText('FLOOR / BOUNDED SPACE',22,floor+radius+16);
   for(let i=0;i<d.balls.length;i++){const b=d.balls[i],px=b.x*width,py=b.y*height;ctx.fillStyle=col.ink;ctx.globalAlpha=.08;ctx.beginPath();ctx.ellipse(px,floor+radius,radius*.9,3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=i===0?col.accent:col.tint;ctx.beginPath();ctx.arc(px,py,radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle=i===0?col.accent:col.accent2;ctx.lineWidth=1.5;ctx.stroke();ctx.textAlign='center';ctx.fillStyle=i===0?col.surface:col.ink;ctx.font='11px "PingFang SC", sans-serif';ctx.fillText(b.label,px,py+4);ctx.textAlign='left'}
  }
  const motion=$('[data-canvas-motion]',r);if(motion)motion.textContent=S.reduced?'REDUCED / INPUT ONLY':S.paused?'PAUSED / INPUT AVAILABLE':'LIVE / LOCAL SIMULATION';
 }
 function resize(){const rect=host.getBoundingClientRect();if(rect.width<1||rect.height<1)return;width=rect.width;height=rect.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paint()}
 function advance(dt){const step=Math.min(dt/16.667,2);if(kind==='token'){if(!drag)d.rotation.y+=.003*step}else if(kind==='particle'){for(const p of d.particles){p.x+=p.vx*step;p.y+=p.vy*step;if(p.x<.04||p.x>.96){p.x=Math.max(.04,Math.min(.96,p.x));p.vx*=-1}if(p.y<.13||p.y>.87){p.y=Math.max(.13,Math.min(.87,p.y));p.vy*=-1}}if(signalRipple){signalRipple.age+=dt;if(signalRipple.age>1100)signalRipple=null}}else{const rad=Math.min(24,width*.065),left=(rad+18)/width,right=1-left;for(const b of d.balls){b.vy+=.0006*step;b.x+=b.vx*step;b.y+=b.vy*step;if(b.x<left||b.x>right){b.x=Math.max(left,Math.min(right,b.x));b.vx*=-.8}if(b.y>.83){b.y=.83;b.vy=-Math.abs(b.vy)*.62}}d.collisions+=LOGIC.collide(d.balls,width,height,rad);for(const b of d.balls){b.x=Math.max(left,Math.min(right,b.x));b.y=Math.max(.14,Math.min(.83,b.y))}}paint()}
 function add(e){if(kind==='token'){d.selected=(d.selected+1)%4}else if(kind==='particle'){d.signals++;const p=d.particles[d.signals%25],rect=canvas.getBoundingClientRect(),px=e?.clientX===undefined?.5:(e.clientX-rect.left)/rect.width,py=e?.clientY===undefined?.5:(e.clientY-rect.top)/rect.height;p.x=Math.max(.04,Math.min(.96,px));p.y=Math.max(.13,Math.min(.87,py));p.vx+=(d.signals%2?.007:-.007);p.vy+=.005;signalRipple={x:p.x,y:p.y,age:S.reduced?500:0}}else{if(d.balls.length>=8){report('容量已满：8 / 8。本次不再添加；重放可恢复初始 3 个事项。');return}d.balls=LOGIC.addBall(d.balls)}result();paint()}
 c.on(btn,'click',()=>add());c.on(canvas,'pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=false;canvas.setPointerCapture(e.pointerId);if(kind!=='token')add(e)});c.on(canvas,'pointermove',e=>{if(kind!=='token'||!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;d.rotation.y+=dx*.012;d.rotation.x=Math.max(-1.2,Math.min(1.2,d.rotation.x+dy*.008));drag={x:e.clientX,y:e.clientY};paint()});c.on(canvas,'pointerup',e=>{if(kind==='token'&&!moved){const rect=canvas.getBoundingClientRect(),hit=LOGIC.hit(points,e.clientX-rect.left,e.clientY-rect.top);if(hit>=0){d.selected=hit;result();paint()}}drag=null});c.on(canvas,'pointercancel',()=>drag=null);
 c.on(canvas,'keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();if(e.key==='Enter'||e.key===' '){add();return}if(kind!=='token')return;if(e.key==='ArrowLeft')d.rotation.y-=.16;if(e.key==='ArrowRight')d.rotation.y+=.16;if(e.key==='ArrowUp')d.rotation.x-=.12;if(e.key==='ArrowDown')d.rotation.x+=.12;paint()});
 const resizeObserver=window.ResizeObserver?new ResizeObserver(resize):null;resizeObserver?.observe(host);c.on(window,'resize',resize);c.on(document,'museum-theme',paint);c.on(document,'museum-motion',paint);c.cleanup(()=>{disposed=true;resizeObserver?.disconnect()});canvas._museumStats=()=>({kind,active:c.stats().raf&&!S.reduced&&!S.paused,signals:d.signals,items:d.balls.length,selected:SPACE_NODES[d.selected].label,projected:points.map(p=>({...p})),collisions:d.collisions});canvas._museumRedraw=paint;resize();result();c.loop(advance);
}
for(const kind of ['token','particle','physics'])REGISTRY[kind]={initial:canvasInitial,render:d=>renderCanvas(kind,d),setup:(r,d,c)=>setupCanvas(kind,r,d,c)};
function renderCatalog(){const query=S.query.trim().toLowerCase(),list=C.filter(x=>!query||[x.name,TITLES[x.type],x.group,x.task,x.intro].join(' ').toLowerCase().includes(query));$('#count').textContent=list.length+' 个机制';$('#catalog').innerHTML=list.length?GROUPS.map(group=>{const items=list.filter(x=>x.group===group);return items.length?`<div class="nav-group">${group}<span>${String(items.length).padStart(2,'0')}</span></div>${items.map(x=>`<button class="nav-item ${x.id===S.selected?'active':''}" data-select="${x.id}" aria-current="${x.id===S.selected?'true':'false'}"><span class="nav-num">${String(C.indexOf(x)+1).padStart(2,'0')}</span><span class="nav-cn">${TITLES[x.type]}<span class="nav-en">${x.name}</span></span><span class="nav-arrow">↗</span></button>`).join('')}`:''}).join(''):'<p class="empty">没有匹配的机制。试试“流程”“数据”“贴纸”，或清空搜索。</p>'}
function select(id,focus=false,replay=false){const record=C.find(x=>x.id===id);if(!record)return;const wasInside=$('#stage').contains(document.activeElement);scope?.dispose();S.selected=id;if(replay)delete S.states[id];const mechanism=REGISTRY[record.type],state=LOGIC.restore(S.states,id,mechanism.initial);$('#category').textContent=record.group+' / '+String(C.indexOf(record)+1).padStart(2,'0')+' OF '+C.length;$('#selectedTitle').innerHTML=TITLES[record.type]+`<span class="mechanism-en">${record.name}</span>`;$('#intro').textContent=record.intro;$('#how').textContent=record.how;$('#usage').textContent=record.task+'。'+record.feedback+'；避免用于'+record.avoid+'。';$('#specimenLabel').textContent=S.static?'静态快照 / 已暂停运行':'交互演示 / '+(S.paused?'已暂停':'可操作');$('#meta').innerHTML=[['实现',record.deps+' · 原创代码，无外部运行时'],['适用风格',record.fit],['不适用场景',record.avoid],['来源与参考',record.source],['组件成熟度',record.quality+'；与项目视觉方向审批无关'],['核验与降级',record.date+' · 点击“静态展示”查看可读快照']].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');const stage=$('#stage');stage.classList.toggle('static-mode',S.static);stage.classList.toggle('is-paused',S.paused);stage.innerHTML=(S.static?'<div class="static-banner">静态展示：保留当前内容和数值，暂停交互与运行。关闭此开关可继续查看。</div>':'')+mechanism.render(state);scope=createScope(stage);mechanism.setup(stage,state,scope);enterSceneText(stage,record.type,scope);if(S.static){$$('button,input,[role="button"]',stage).forEach(el=>{if('disabled'in el)el.disabled=true;else{el.setAttribute('tabindex','-1');el.setAttribute('aria-disabled','true')}})}renderCatalog();$('#pause').disabled=S.static;$('#replay').disabled=S.static;if(focus||wasInside)$('#selectedTitle').focus({preventScroll:true});if(matchMedia('(max-width:850px)').matches&&focus){$('#sidebar').classList.remove('open');$('#catalogToggle').setAttribute('aria-expanded','false')}window.dispatchEvent(new CustomEvent('museum-selected',{detail:{id,type:record.type}}))}
$('#catalog').addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b)select(b.dataset.select,true)});$('#search').addEventListener('input',e=>{S.query=e.target.value;$('#sidebar').classList.add('open');$('#catalogToggle').setAttribute('aria-expanded','true');renderCatalog()});const toggleCatalog=()=>{const open=$('#sidebar').classList.toggle('open');$('#catalogToggle').setAttribute('aria-expanded',String(open))};$('#catalogToggle').addEventListener('click',toggleCatalog);$('#catalogToggle').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCatalog()}});$('#previous').addEventListener('click',()=>select(C[(C.findIndex(x=>x.id===S.selected)+C.length-1)%C.length].id,true));$('#next').addEventListener('click',()=>select(C[(C.findIndex(x=>x.id===S.selected)+1)%C.length].id,true));$('#replay').addEventListener('click',()=>{S.paused=false;$('#pause').textContent='Ⅱ 暂停';$('#pause').setAttribute('aria-pressed','false');select(S.selected,false,true)});$('#pause').addEventListener('click',()=>{S.paused=!S.paused;$('#pause').textContent=S.paused?'▷ 继续':'Ⅱ 暂停';$('#pause').setAttribute('aria-pressed',String(S.paused));$('#stage').classList.toggle('is-paused',S.paused);$('#specimenLabel').textContent='交互演示 / '+(S.paused?'已暂停':'可操作');scope?.resume();document.dispatchEvent(new Event('museum-motion'))});function updateMotion(){S.reduced=media.matches||$('#reduceMotion').checked;document.body.dataset.motion=S.reduced?'reduce':'normal';scope?.motion();document.dispatchEvent(new Event('museum-motion'))}media.addEventListener?.('change',updateMotion);$('#reduceMotion').addEventListener('change',updateMotion);$('#staticMode').addEventListener('change',e=>{S.static=e.target.checked;select(S.selected)});$$('[data-skin-choice]').forEach(b=>b.addEventListener('click',()=>{S.skin=b.dataset.skinChoice;document.body.dataset.skin=S.skin;$$('[data-skin-choice]').forEach(el=>{const yes=el===b;el.classList.toggle('active',yes);el.setAttribute('aria-pressed',String(yes))});document.dispatchEvent(new Event('museum-theme'))}));

window.__museum={logic:LOGIC,records:C,registry:REGISTRY,select,stats:()=>({selected:S.selected,skin:S.skin,static:S.static,reduced:S.reduced,paused:S.paused,canvases:$$('canvas').length,scope:scope?.stats()}),state:()=>JSON.parse(JSON.stringify(S.states[S.selected]))};
